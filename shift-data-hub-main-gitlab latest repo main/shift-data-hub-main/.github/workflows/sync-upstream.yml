name: Sync upstream (instant)

on:
  repository_dispatch:
    types: [upstream-push]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch & sync
        run: |
          git remote add upstream https://github.com/AxelShift/Shift-Airdrop-Backend.git
          git fetch upstream
          git reset --hard upstream/main
          git push origin main --force
